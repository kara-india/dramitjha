<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" aria-label="Human body diagram">
  <title>Human body — select a region</title>
  <defs>
    <style>
      .body-fill { fill: #1e3a38; stroke: #2dd4bf; stroke-width: 1.5; }
      .hotspot   { fill: rgba(45,212,191,0.35); stroke: #2dd4bf; stroke-width: 1.5; cursor: pointer; }
      .hotspot:hover,
      .hotspot:focus { fill: #d5f14c; outline: none; }
    </style>
  </defs>

  <!-- ── BODY SILHOUETTE ─────────────────────────────────────── -->

  <!-- Head -->
  <ellipse class="body-fill" cx="100" cy="35" rx="24" ry="28" />

  <!-- Neck -->
  <rect class="body-fill" x="91" y="60" width="18" height="18" rx="4" />

  <!-- Torso -->
  <rect class="body-fill" x="68" y="78" width="64" height="110" rx="10" />

  <!-- Spine indicator (centre line) -->
  <line x1="100" y1="82" x2="100" y2="185" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Left upper arm -->
  <rect class="body-fill" x="38" y="80" width="26" height="70" rx="10" />
  <!-- Right upper arm -->
  <rect class="body-fill" x="136" y="80" width="26" height="70" rx="10" />

  <!-- Left forearm -->
  <rect class="body-fill" x="40" y="155" width="22" height="60" rx="9" />
  <!-- Right forearm -->
  <rect class="body-fill" x="138" y="155" width="22" height="60" rx="9" />

  <!-- Left hand/wrist -->
  <ellipse class="body-fill" cx="51" cy="226" rx="14" ry="10" />
  <!-- Right hand/wrist -->
  <ellipse class="body-fill" cx="149" cy="226" rx="14" ry="10" />

  <!-- Left thigh -->
  <rect class="body-fill" x="72" y="192" width="28" height="90" rx="10" />
  <!-- Right thigh -->
  <rect class="body-fill" x="101" y="192" width="28" height="90" rx="10" />

  <!-- Left shin -->
  <rect class="body-fill" x="73" y="286" width="24" height="80" rx="8" />
  <!-- Right shin -->
  <rect class="body-fill" x="103" y="286" width="24" height="80" rx="8" />

  <!-- Left foot -->
  <ellipse class="body-fill" cx="82"  cy="374" rx="16" ry="10" />
  <!-- Right foot -->
  <ellipse class="body-fill" cx="118" cy="374" rx="16" ry="10" />

  <!-- ── INTERACTIVE HOTSPOTS (data-part matches bodyParts.ts ids) ─────── -->
  <!-- Each hotspot: tabindex + role + aria-label added by BodySelectorSVG component -->

  <!-- head -->
  <ellipse class="hotspot" data-part="head"
    cx="100" cy="35" rx="24" ry="28" />

  <!-- neck -->
  <rect class="hotspot" data-part="neck"
    x="91" y="60" width="18" height="18" rx="4" />

  <!-- shoulder (left + right combined hit area) -->
  <ellipse class="hotspot" data-part="shoulder" cx="51"  cy="88" rx="18" ry="14" />
  <ellipse class="hotspot" data-part="shoulder" cx="149" cy="88" rx="18" ry="14" />

  <!-- elbow -->
  <ellipse class="hotspot" data-part="elbow" cx="48"  cy="152" rx="14" ry="12" />
  <ellipse class="hotspot" data-part="elbow" cx="152" cy="152" rx="14" ry="12" />

  <!-- wrist -->
  <ellipse class="hotspot" data-part="wrist" cx="51"  cy="218" rx="14" ry="10" />
  <ellipse class="hotspot" data-part="wrist" cx="149" cy="218" rx="14" ry="10" />

  <!-- spine (torso centre strip) -->
  <rect class="hotspot" data-part="spine"
    x="92" y="86" width="16" height="96" rx="6" opacity="0.7" />

  <!-- hip -->
  <ellipse class="hotspot" data-part="hip" cx="78"  cy="198" rx="18" ry="12" />
  <ellipse class="hotspot" data-part="hip" cx="122" cy="198" rx="18" ry="12" />

  <!-- knee -->
  <ellipse class="hotspot" data-part="knee" cx="83"  cy="284" rx="15" ry="12" />
  <ellipse class="hotspot" data-part="knee" cx="117" cy="284" rx="15" ry="12" />

  <!-- ankle -->
  <ellipse class="hotspot" data-part="ankle" cx="81"  cy="366" rx="13" ry="10" />
  <ellipse class="hotspot" data-part="ankle" cx="119" cy="366" rx="13" ry="10" />
</svg>
